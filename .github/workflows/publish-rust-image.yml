name: Publish Rust Image

on:
  push:
    branches: [ main, feature/improvements ]
    paths:
      - 'rust_pytes_serial/**'
      - 'Dockerfile.rust'
      - '.github/workflows/publish-rust-image.yml'
  workflow_dispatch:
    inputs:
      push_tls_variant:
        description: 'Also build and push TLS feature variant'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: write

jobs:
  build-default:
    name: Build & Push (default)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repository root
        run: |
          ls -al .
          echo '---'
          ls -al rust_pytes_serial || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push default (no features)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust_pytes_serial/Dockerfile.rust
          push: true
          tags: ghcr.io/svisagie/pylon_serial:rust-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Summary
        run: echo "Published ghcr.io/svisagie/pylon_serial:rust-latest" >> $GITHUB_STEP_SUMMARY

  build-tls:
    name: Build & Push (tls feature)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.push_tls_variant == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repository root
        run: |
          ls -al .
          echo '---'
          ls -al rust_pytes_serial || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push TLS (features=tls)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: rust_pytes_serial/Dockerfile.rust
          push: true
          tags: ghcr.io/svisagie/pylon_serial:rust-tls-latest
          build-args: |
            FEATURES=tls
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Summary
        run: echo "Published ghcr.io/svisagie/pylon_serial:rust-tls-latest" >> $GITHUB_STEP_SUMMARY

  done:
    needs: [build-default, build-tls]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "All requested images published." >> $GITHUB_STEP_SUMMARY
